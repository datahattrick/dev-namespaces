# Default values for capsule-devspaces.
#
# This chart wraps the upstream Capsule chart (`capsule:` below) and deploys
# only the controller. The upstream controller RBAC (cluster-admin, or the
# broad "strict" ClusterRole) is switched off and replaced by the hardened
# RBAC rendered from `controllerRbac:`.

# -- Names shared between this chart and the Capsule subchart.
# These must match the corresponding `capsule.*` values below; the chart fails
# to render if they drift.
names:
  # -- Must equal `capsule.fullnameOverride`. Used to derive webhook and secret names.
  capsuleFullname: capsule
  # -- Must equal `capsule.serviceAccount.name`.
  controllerServiceAccount: capsule
  # -- Must equal `capsule.manager.options.rbac.provisioner`.
  provisionerClusterRole: capsule-namespace-provisioner
  # -- Must equal `capsule.manager.options.rbac.deleter`.
  deleterClusterRole: capsule-namespace-deleter

# Hardened RBAC for the Capsule controller ServiceAccount.
controllerRbac:
  # -- Render the hardened ClusterRole, Role and bindings for the controller.
  create: true
  # -- Grant cluster-wide list/patch/delete on every resource (secrets
  # included), which Capsule uses to strip finalizers from objects in
  # terminating tenant namespaces. Upstream grants this; it is off here.
  # Namespaces still delete normally, but the controller logs "forbidden"
  # errors while each one terminates, and namespaces stuck on a finalizer
  # need an administrator.
  allowCascadingCleanup: false
  # -- ClusterRoles the controller may `bind`, in addition to the
  # provisioner/deleter roles, `capsule.manager.options.rbac.*ClusterRoles`,
  # and any role named in `tenants` above. List every role used by Tenants and
  # TenantOwners managed outside this chart (owners[].clusterRoles,
  # additionalRoleBindings[].clusterRoleName); others fail to bind.
  extraBindableClusterRoles:
    - admin
  # -- Extra cluster-scoped PolicyRules for the controller.
  # The controller cannot impersonate, so GlobalTenantResources replicate with
  # its own permissions: it already writes LimitRanges, ResourceQuotas,
  # NetworkPolicies and RoleBindings; any other replicated kind needs a rule
  # here. Kinds referenced by GlobalCustomQuota sources or Tenant rules need
  # read access here.
  extraRules: []
  #  - apiGroups: [""]
  #    resources: ["configmaps"]
  #    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# -- Additional ClusterRoles, keyed by name.
# Each value accepts `labels`, `annotations`, `rules` and `aggregationRule`.
clusterRoles: {}
#  devspaces-extra:
#    rules:
#      - apiGroups: ["route.openshift.io"]
#        resources: ["routes/custom-host"]
#        verbs: ["create"]

# -- Additional ClusterRoleBindings, keyed by name.
# Each value accepts `labels`, `annotations`, `roleRef` and `subjects`.
clusterRoleBindings: {}
#  devspaces-admins-view:
#    roleRef:
#      apiGroup: rbac.authorization.k8s.io
#      kind: ClusterRole
#      name: view
#    subjects:
#      - kind: Group
#        apiGroup: rbac.authorization.k8s.io
#        name: platform-admins

# -- Capsule Tenants, keyed by name. `spec` is passed through unchanged.
# Usually managed outside this chart. Every owner must list `clusterRoles`
# explicitly, and each role must be bindable (see
# `controllerRbac.extraBindableClusterRoles`).
tenants: {}
