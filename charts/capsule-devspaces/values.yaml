# Deletes developer namespaces once they expire.
#
# Only namespaces carrying the `selectorLabel` key, with any value, are
# considered. Expiry is the namespace creationTimestamp plus `defaultTTL`,
# overridable per namespace with labels (capped at `maxTTL` from creation):
#   devspaces.io/ttl: "3d"            lifetime from creation (s, m, h, d, w)
#   devspaces.io/delete: "true"       delete once expired (same as no label)
#   devspaces.io/delete: "false"      never delete (forbid for tenant owners)
reaper:
  # -- Deploy the reaper CronJob.
  enabled: true
  # -- Cron schedule.
  schedule: "*/15 * * * *"
  # -- Optional CronJob time zone, e.g. `Europe/London`.
  timeZone: ""
  # -- Log what would be deleted without deleting or annotating anything.
  dryRun: false
  # -- Label key that makes a namespace eligible for deletion. Its value is
  # ignored.
  selectorLabel: devspaces.io/reap
  # -- Lifetime when no label overrides it.
  defaultTTL: 7d
  # -- Upper bound on any label override.
  maxTTL: 30d
  # -- Stop after this many deletions in a single run.
  maxDeletionsPerRun: 25
  # -- Write the computed expiry to the `devspaces.io/expires-at` annotation.
  annotateExpiry: true
  # -- Seconds to wait in each run for requested deletions to finish before
  # logging `namespace_deletion_pending`.
  deleteWaitSeconds: 120
  # -- A tenant namespace terminating longer than this is logged as
  # `namespace_deletion_stuck` on every run.
  stuckAfter: 30m
  # -- Fail the Job when any namespace is stuck, as well as on failed
  # deletions and annotations.
  failOnStuck: true
  # -- `info` logs deletions, failures and run summaries; `debug` adds one line
  # per namespace per run.
  logLevel: info
  # -- Label and annotation keys.
  keys:
    ttl: devspaces.io/ttl
    delete: devspaces.io/delete
    expiresAt: devspaces.io/expires-at
  # -- Namespaces that are never deleted, whatever their labels.
  protectedNamespaces:
    - default
    - kube-system
    - kube-public
    - kube-node-lease
  # -- Namespaces matching this regex are never deleted.
  protectedNamespaceRegex: "^(kube-|openshift)"
  # -- Back the RBAC with a ValidatingAdmissionPolicy so the reaper can only
  # delete or annotate namespaces with `selectorLabel` that are not marked
  # `delete: "false"`.
  admissionPolicy:
    enabled: true
  image:
    registry: registry.access.redhat.com
    repository: ubi9/python-312
    tag: "1"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 600
  backoffLimit: 0
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Upstream Capsule chart values.
# Reference: https://github.com/projectcapsule/capsule/tree/main/charts/capsule
capsule:
  fullnameOverride: capsule

  serviceAccount:
    create: true
    name: capsule

  crds:
    install: true

  proxy:
    enabled: false

  # Tenant owners get no access to Capsule CRDs.
  rbac:
    resources:
      create: false
    resourcepoolclaims:
      create: false
    customquotas:
      create: false

  monitoring:
    dashboards:
      enabled: false
    serviceMonitor:
      enabled: false
    prometheusRules:
      enabled: false

  # Webhook certificates. Upstream defaults to cert-manager.
  # Without cert-manager set `certManager.generateCertificates: false` and
  # `tls.create: true` + `tls.enableController: true`.
  certManager:
    generateCertificates: true
  tls:
    create: false
    enableController: false

  manager:
    # Replaced by `controllerRbac` above.
    rbac:
      create: false
    options:
      # Members of these groups can create namespaces; Capsule assigns them to
      # the tenant they own.
      users:
        - kind: Group
          name: devspaces-users
      administrators: []
      forceTenantPrefix: true
      allowServiceAccountPromotion: false
      protectedNamespaceRegex: "^(kube-|openshift|default$|capsule)"
      rbac:
        provisioner: capsule-namespace-provisioner
        deleter: capsule-namespace-deleter
        administrationClusterRoles:
          - capsule-namespace-deleter
        promotionClusterRoles: []

  webhooks:
    hooks:
      # ResourcePools are not used; quota is enforced by ClusterResourceQuota.
      resourcepools:
        pools:
          enabled: false
        claims:
          enabled: false
      # Capsule only exempts the garbage collector inside terminating
      # namespaces, so objects it manages elsewhere (QuantityLedgers in this
      # namespace) leak when their owner is deleted. Let the garbage collector
      # delete them.
      managed:
        matchConditions:
          - name: allow-garbage-collector-deletes
            expression: >-
              !(request.operation == "DELETE" &&
              request.userInfo.username == "system:serviceaccount:kube-system:generic-garbage-collector")
      # Admission-time enforcement of GlobalCustomQuota limits. Without it the
      # controller only reports usage in the quota status.
      calculations:
        enabled: false
        failurePolicy: Fail
        matchPolicy: Equivalent
        # Upstream matches every namespace; with failurePolicy Fail a controller
        # outage would then block the counted kinds cluster-wide.
        namespaceSelector:
          matchExpressions:
            - key: capsule.clastix.io/tenant
              operator: Exists
        objectSelector: {}
        matchConditions: []
        # Resources counted by GlobalCustomQuota sources. Also grants the
        # controller get/list/watch on each, so list them even with the
        # webhook disabled. Add the status subresource (e.g. pods/status) when
        # a source path reads status fields.
        rules: []
        #  - apiGroups: [""]
        #    apiVersions: ["v1"]
        #    operations: ["CREATE", "UPDATE", "DELETE"]
        #    resources: ["services"]
        #    scope: Namespaced
