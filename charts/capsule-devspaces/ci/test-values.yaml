globalTenantResources:
  devspaces-baseline:
    spec:
      resyncPeriod: 60s
      pruningOnDelete: true
      settings: {}
      tenantSelector:
        matchLabels:
          kubernetes.io/metadata.name: developers
      resources:
        - rawItems:
            - apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: default-deny-ingress
              spec:
                podSelector: {}
                policyTypes: ["Ingress"]
            - apiVersion: v1
              kind: LimitRange
              metadata:
                name: defaults
              spec:
                limits:
                  - type: Container
                    default:
                      memory: 256Mi
                    defaultRequest:
                      cpu: 50m
                      memory: 64Mi

globalResourceQuotas:
  devspaces-object-counts:
    spec:
      namespaceSelectors:
        - matchLabels:
            capsule.clastix.io/tenant: developers
      quota:
        hard:
          count/configmaps: "40"

reaper:
  schedule: "0 0 1 1 *"
